name: Playwright Docker Smart Pipeline

on:
  push:
    branches:
      - feature_branch

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    environment: ${{ matrix.env }}

    strategy:
      fail-fast: false
      matrix:
        env: [dev,staging]
        shardIndex: [1,2,3,4]
        shardTotal: [4]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Docker image name and tag
        run: |
          echo "IMAGE_REPO=ghcr.io/${GITHUB_REPOSITORY,,}/playwright-tests" >> $GITHUB_ENV
          echo "IMAGE_TAG=${{ hashFiles('Dockerfile', 'package.json', 'package-lock.json', '.dockerignore') }}" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if Docker image already exists
        id: check-image
        run: |
          IMAGE_NAME="$IMAGE_REPO:$IMAGE_TAG"

          echo "Checking image: $IMAGE_NAME"

          if docker manifest inspect "$IMAGE_NAME" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Docker image already exists. Build will be skipped."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Docker image not found. Build will happen."
          fi

      - name: Set up Docker Buildx
        if: steps.check-image.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image if missing
        if: steps.check-image.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Playwright tests using Docker image
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          ENV: ${{ matrix.env }}
        run: |
          docker run --rm \
            --shm-size=1g \
            -e BASE_URL \
            -e USERNAME \
            -e PASSWORD \
            -e ENV \
            -v "${{ github.workspace }}:/app" \
            -w /app \
            "$IMAGE_REPO:$IMAGE_TAG" \
            bash -c "npm ci && CI=true npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}"

      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.env }}-${{ matrix.shardIndex }}
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.env }}-${{ matrix.shardIndex }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
