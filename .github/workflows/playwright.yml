name: Playwright Docker Smart Pipeline

on:
  push:
    branches:
      - feature_branch

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/playwright-tests:latest

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if Docker image exists
        id: check-image
        run: |
          if docker manifest inspect $IMAGE_NAME > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Docker image already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Docker image does not exist"
          fi

      - name: Set up Docker Buildx
        if: steps.check-image.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image if missing
        if: steps.check-image.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Playwright tests using Docker image
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/app \
            -w /app \
            $IMAGE_NAME \
            bash -c "npm ci && CI=true npx playwright test"

      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7